plugins {
    id 'application'
}

group = 'peofksk'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation files('lib/jl1.0.1.jar')
}

application {
    mainClass = 'app.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
